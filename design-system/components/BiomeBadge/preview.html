<!-- @dsCard group="TTE organisms" height=130 subtitle="Biome as a contained swatch, never as a fill" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface); color: var(--ink); }
  .cap { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: .09em;
         text-transform: uppercase; color: var(--fire-orange); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .bb { display: inline-flex; align-items: center; gap: var(--space-1);
        padding: var(--space-1) var(--space-2);
        border: var(--border-width-thin) solid color-mix(in srgb, var(--ink) 22%, transparent);
        border-radius: var(--radius-default);
        font-family: "Space Mono", monospace; font-size: 10px; font-weight: 700;
        letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .sw { width: 9px; height: 9px; flex: none; }
</style>
<div class="cap">the four biomes &mdash; the name carries the information, the swatch reinforces it</div>
<div class="row">
  <span class="bb"><i class="sw" style="background:var(--biome-desert)"></i>Desert</span>
  <span class="bb"><i class="sw" style="background:var(--biome-arctic)"></i>Arctic</span>
  <span class="bb"><i class="sw" style="background:var(--biome-city)"></i>City</span>
  <span class="bb"><i class="sw" style="background:var(--biome-forest)"></i>Forest</span>
</div>
