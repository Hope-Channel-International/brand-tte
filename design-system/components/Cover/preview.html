<!-- @dsCard height=340 -->
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); }
  .cover { position: relative; width: 960px; height: 340px; overflow: hidden; }
  .tick     { fill: var(--fire-orange); }
  .slab-fire{ fill: var(--fire-orange); }
  .slab-ink { fill: var(--ink); }
  .slab-grey{ fill: var(--grey); }
  .slab-dune{ fill: var(--biome-desert); }
  .contour  { fill: none; stroke: var(--surface); stroke-width: 2; }
  .text { position: absolute; left: 48px; top: 176px; }
  .name { font-family: "Mona Sans", system-ui, sans-serif; font-size: 64px; font-weight: 900;
          line-height: .95; letter-spacing: .02em; text-transform: uppercase;
          color: var(--ink); margin: 0; }
  .tagline { font-family: "Space Mono", monospace; font-size: 13px; line-height: 1.4;
             letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted);
             margin: 16px 0 0; max-width: 560px; }
</style>

<div class="cover">
<!--
  BLOCOS      fire-orange 352x108 · ink 256x108 · grey 128x108 · biome-desert 224x108;
              tick fire-orange 960x4 (border-width-thick), o mesmo tick vivo do HUD Panel.
  ARRANJO     faixa de bandas desiguais no topo, encostadas, como as linhas de um painel de
              HUD; a marca compoe em tiras horizontais, nao em grade de quadrados.
  PADRAO      curvas de nivel concentricas com centro na borda direita, correndo para fora do
              mapa: o motivo literal da marca reduzido a geometria, recortado no fundo por cima
              das quatro bandas. Escolhido porque a textura topografica e a assinatura visual da
              TTE e nenhuma outra marca cairia nela.
  ESCALAS     larguras em multiplos de space-8 32px, somando 960; 15 curvas em passo de
              space-16 64px; traco border-width-default 2px; tick border-width-thick 4px;
              raio radius-default 0.
-->
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <clipPath id="band"><rect x="0" y="16" width="960" height="108"/></clipPath>
  </defs>

  <rect class="tick" x="0" y="0" width="960" height="4"/>

  <rect class="slab-fire" x="0"   y="16" width="352" height="108"/>
  <rect class="slab-ink"  x="352" y="16" width="256" height="108"/>
  <rect class="slab-grey" x="608" y="16" width="128" height="108"/>
  <rect class="slab-dune" x="736" y="16" width="224" height="108"/>

  <g clip-path="url(#band)">
    <circle class="contour" cx="960" cy="124" r="64"/>
    <circle class="contour" cx="960" cy="124" r="128"/>
    <circle class="contour" cx="960" cy="124" r="192"/>
    <circle class="contour" cx="960" cy="124" r="256"/>
    <circle class="contour" cx="960" cy="124" r="320"/>
    <circle class="contour" cx="960" cy="124" r="384"/>
    <circle class="contour" cx="960" cy="124" r="448"/>
    <circle class="contour" cx="960" cy="124" r="512"/>
    <circle class="contour" cx="960" cy="124" r="576"/>
    <circle class="contour" cx="960" cy="124" r="640"/>
    <circle class="contour" cx="960" cy="124" r="704"/>
    <circle class="contour" cx="960" cy="124" r="768"/>
    <circle class="contour" cx="960" cy="124" r="832"/>
    <circle class="contour" cx="960" cy="124" r="896"/>
    <circle class="contour" cx="960" cy="124" r="960"/>
  </g>
</svg>

<div class="text">
  <p class="name">To the ends of<br>the earth</p>
  <p class="tagline">The statistic feels impossible. The theology says inevitable.</p>
</div>
</div>
